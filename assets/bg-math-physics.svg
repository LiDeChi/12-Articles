<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" fill="none">
  <rect width="960" height="720" fill="#fffcf7"/>
  <g fill="#1a1714" fill-opacity="0.045" font-family="Georgia, 'Times New Roman', serif" font-size="15">
    <text x="36" y="48">E = mc²</text>
    <text x="220" y="72">∇·E = ρ/ε₀</text>
    <text x="480" y="54">∫ f(x) dx</text>
    <text x="720" y="80">∑_{n=1}^∞ 1/n²</text>
    <text x="64" y="140">iℏ ∂ψ/∂t = Ĥψ</text>
    <text x="360" y="160">F = ma</text>
    <text x="560" y="130">a² + b² = c²</text>
    <text x="780" y="150">∇×B = μ₀J</text>
    <text x="40" y="230">∂²u/∂t² = c² ∇²u</text>
    <text x="300" y="250">∮ E·dl = −dΦ_B/dt</text>
    <text x="640" y="220">P(A|B) = P(B|A)P(A)/P(B)</text>
    <text x="80" y="320">λ = h/p</text>
    <text x="260" y="340">R_μν − ½Rg_μν = 8πGT_μν</text>
    <text x="700" y="310">e^{iπ} + 1 = 0</text>
    <text x="48" y="410">ΔS ≥ 0</text>
    <text x="200" y="430">V = IR</text>
    <text x="380" y="400">⟨ψ|φ⟩</text>
    <text x="520" y="440">lim_{x→0} sin x / x = 1</text>
    <text x="800" y="420">PV = nRT</text>
    <text x="70" y="510">dS = đQ_rev / T</text>
    <text x="320" y="530">∇²φ = 0</text>
    <text x="500" y="500">σ_x σ_p ≥ ℏ/2</text>
    <text x="740" y="540">χ² = Σ (O−E)²/E</text>
    <text x="40" y="610">ω = 2πf</text>
    <text x="200" y="640">T = 2π√(L/g)</text>
    <text x="460" y="600">N_A ≈ 6.022×10²³</text>
    <text x="720" y="630">det(A − λI) = 0</text>
    <text x="100" y="700">γ = 1/√(1−v²/c²)</text>
    <text x="520" y="690">∂L/∂q − d/dt(∂L/∂q̇) = 0</text>
  </g>
  <!-- faint apparatus / experiment sketches -->
  <g stroke="#1a1714" stroke-opacity="0.04" fill="none" stroke-width="1.2">
    <!-- pendulum -->
    <line x1="860" y1="40" x2="860" y2="100"/>
    <circle cx="860" cy="112" r="10"/>
    <!-- prism refraction -->
    <path d="M40 560 L70 610 L10 610 Z"/>
    <line x1="5" y1="575" x2="35" y2="585"/>
    <line x1="55" y1="585" x2="90" y2="560"/>
    <line x1="55" y1="590" x2="95" y2="600"/>
    <line x1="55" y1="595" x2="92" y2="620"/>
    <!-- simple lens -->
    <ellipse cx="480" cy="40" rx="28" ry="12"/>
    <line x1="430" y1="40" x2="530" y2="40"/>
    <!-- atom-ish orbits -->
    <ellipse cx="900" cy="400" rx="36" ry="14" transform="rotate(-20 900 400)"/>
    <ellipse cx="900" cy="400" rx="36" ry="14" transform="rotate(40 900 400)"/>
    <ellipse cx="900" cy="400" rx="36" ry="14" transform="rotate(100 900 400)"/>
    <circle cx="900" cy="400" r="3" fill="#1a1714" fill-opacity="0.05" stroke="none"/>
    <!-- spring -->
    <path d="M200 40 q8 8 0 16 q-8 8 0 16 q8 8 0 16 q-8 8 0 16"/>
    <!-- coordinate axes -->
    <path d="M880 680 L880 640 L920 640"/>
    <path d="M882 648 Q900 620 918 648"/>
  </g>
</svg>
