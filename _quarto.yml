project:
  type: website
  render:
    - "*.qmd"
    - "posts/*.md"
  pre-render:
    - "node scripts/check-content.mjs"
  post-render:
    - "node scripts/export-manifest.mjs"

website:
  title: "李德驰的研究笔记"
  description: "数学、人工智能、Agent、强化学习与认知科学"
  site-url: "https://lidechi.github.io/12-Articles"
  repo-url: "https://github.com/LiDeChi/12-Articles"
  repo-actions: [source]
  favicon: "assets/favicon.svg"
  search: true
  draft-mode: gone
  open-graph: true
  twitter-card: true
  navbar:
    left:
      - href: index.qmd
        text: "文章"
      - href: about.qmd
        text: "关于"
    right:
      - icon: house
        text: "主页"
        href: "https://wordm.us/blog/"
      - icon: rss
        aria-label: "RSS"
        href: index.xml

bibliography: references.bib

lang: zh

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    number-sections: true
    code-fold: true
    code-overflow: wrap
    anchor-sections: true
    smooth-scroll: true
