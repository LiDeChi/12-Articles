name: Quarto Publish

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render
        run: quarto render

      - name: Publish generated site branch
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync the existing Pages root
        run: node scripts/sync-pages-root.mjs

      - name: Commit generated Pages files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .published-site-files .nojekyll about.html articles.json index.html index.xml listings.json robots.txt search.json sitemap.xml site_libs posts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh published article site [skip ci]"
          git push origin HEAD:main
